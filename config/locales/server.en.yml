en:
  site_settings:
    chat_email_default_never_enabled: "Master switch for this plugin. Assigns chat_email_frequency = never to newly created users instead of the database default of 'when away'. Off = core behaviour, and every other setting below is inert. Existing users are never touched."
    chat_email_never_suppresses_summary: "Honour chat_email_frequency = never for the WHOLE chat summary email. Core only applies 'never' to unread direct messages; channel @mentions and watched threads are gated by 'default email level' instead, so a user set to never still receives them. Turning this on suppresses the entire chat summary email for those users. Does not affect chat content that arrives as an ordinary private message or topic (flag PMs, channel-archive PMs, archived transcripts). Requires the master switch above."
